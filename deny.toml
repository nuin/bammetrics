# cargo-deny configuration: `make deny` (cargo install cargo-deny --locked).
# Checks the dependency graph of the seven workspace crates and the vendored
# noodles-cram: licences, banned and duplicated crates, registries, and the
# RustSec advisory database. Every exception below carries its reason.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# The workspace is MIT OR Apache-2.0. A dependency may carry any licence that
# both allow in a statically linked binary and a wheel.
allow = [
    "MIT",
    "Apache-2.0",
    # unicode-ident (the data tables of proc-macro2).
    "Unicode-3.0",
    # zlib-rs, the inflater and deflater under noodles-bgzf and gzip.rs.
    "Zlib",
    # libbz2-rs-sys, the bzip2 codec of noodles-cram: a BSD-style licence that
    # asks for the copyright notice and for changed versions to be marked.
    "bzip2-1.0.6",
    # target-lexicon, a build dependency of pyo3: Apache-2.0 with the LLVM
    # exception, which only loosens Apache-2.0 for compiled output.
    "Apache-2.0 WITH LLVM-exception",
    # The PDF report (crates/pdf, feature pdf): tiny-skia and tiny-skia-path
    # under krilla-svg, encoding_rs under lopdf (a dev-dependency of the
    # structure test), arrayref under tiny-skia. Both licences ask for the
    # copyright notice only.
    "BSD-3-Clause",
    "BSD-2-Clause",
    # tiny-keccak under const-random under ahash, a dependency of parquet
    # (feature parquet), on wasm32 only: a public domain dedication. snap,
    # parquet's snappy codec, is BSD-3-Clause.
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "deny"
wildcards = "deny"
# Two versions each, all under the PDF report (feature pdf of crates/pdf),
# none in the default build: png and tiny-skia take miniz_oxide 0.8 where
# flate2 takes 0.9; fontdb's fontconfig-parser takes roxmltree 0.20 where
# usvg takes 0.21; gif under krilla takes weezl 0.1 where lopdf, the
# dev-dependency of the structure test, takes 0.2.
skip = [
    { crate = "miniz_oxide@0.8.9", reason = "png and tiny-skia under krilla, feature pdf" },
    { crate = "roxmltree@0.20.0", reason = "fontconfig-parser under fontdb, feature pdf" },
    { crate = "weezl@0.1.12", reason = "gif under krilla, feature pdf" },
    { crate = "getrandom@0.3.4", reason = "ahash under parquet, feature parquet" },
    { crate = "getrandom@0.2.17", reason = "const-random under ahash under parquet, wasm32 only, feature parquet" },
    { crate = "r-efi@5.3.0", reason = "getrandom 0.3 under ahash under parquet, UEFI only, feature parquet" },
]
# The workspace crates name each other by path and version.
allow-wildcard-paths = true
# docs/05 section 4.9: no crate makes a network call. A client or a TLS stack
# in the graph means one could.
deny = [
    { crate = "reqwest", reason = "docs/05 section 4.9: no network call" },
    { crate = "hyper", reason = "docs/05 section 4.9: no network call" },
    { crate = "ureq", reason = "docs/05 section 4.9: no network call" },
    { crate = "curl", reason = "docs/05 section 4.9: no network call" },
    { crate = "openssl-sys", reason = "docs/05 section 4.9: no network call, no C TLS stack" },
    { crate = "native-tls", reason = "docs/05 section 4.9: no network call" },
    { crate = "rustls", reason = "docs/05 section 4.9: no network call" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
