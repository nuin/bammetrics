[package]
name = "bammetrics-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The bammetrics command: Picard-concordant BAM QC metrics, verdicts and reports"
publish = false

[lib]
name = "bammetrics_cli"
path = "src/lib.rs"

[[bin]]
name = "bammetrics"
path = "src/main.rs"

[features]
# `report --pdf` and `qc --report pdf`. Needs rustc 1.92 (krilla); the
# default build keeps rust-version 1.88.
pdf = ["dep:bammetrics-pdf", "bammetrics-pdf/pdf"]

[dependencies]
bammetrics-core.workspace = true
bammetrics-formats.workspace = true
# The PDF report (docs/pdf.md), only with the feature `pdf`: the default
# build links no krilla code.
bammetrics-pdf = { workspace = true, optional = true }
bammetrics-report.workspace = true
bammetrics-verdict.workspace = true
clap.workspace = true
clap_complete = "4"
# statvfs for the free-space refusal of a chain; already in the tree
# through signal-hook and clap.
libc = "0.2"
signal-hook = "0.3"
thiserror.workspace = true
