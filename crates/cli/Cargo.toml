[package]
name = "bammetrics-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The bammetrics command: Picard-concordant BAM QC metrics, verdicts and reports"
publish = false

[lib]
name = "bammetrics_cli"
path = "src/lib.rs"

[[bin]]
name = "bammetrics"
path = "src/main.rs"

[dependencies]
bammetrics-core.workspace = true
bammetrics-formats.workspace = true
bammetrics-report.workspace = true
bammetrics-verdict.workspace = true
clap.workspace = true
clap_complete = "4"
signal-hook = "0.3"
thiserror.workspace = true
