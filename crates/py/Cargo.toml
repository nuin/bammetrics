[package]
name = "bammetrics-py"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "bammetrics"
crate-type = ["cdylib"]

[features]
# The PDF report through `bammetrics_cli` (pyproject.toml turns it on for
# the wheel).
pdf = ["bammetrics-cli/pdf"]

[dependencies]
bammetrics-cli = { path = "../cli" }
bammetrics-core.workspace = true
bammetrics-formats.workspace = true
bammetrics-report.workspace = true
bammetrics-verdict.workspace = true
pyo3.workspace = true
