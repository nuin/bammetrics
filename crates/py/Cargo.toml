[package]
name = "bammetrics"
version = "0.1.0"
edition = "2021"

[lib]
name = "bammetrics"
crate-type = ["cdylib"]

[dependencies]
noodles = { version = "0.77", features = ["bam", "sam", "bgzf"] }
hashbrown = "=0.14.5"
indexmap  = "=2.2.6"
pyo3 = { version = "0.22", features = ["extension-module"] }
