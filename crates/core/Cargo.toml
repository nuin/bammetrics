[package]
name = "bammetrics-core"
version = "0.1.0"
edition = "2021"

[dependencies]
noodles = { version = "0.77", features = ["bam", "sam", "bgzf"] }
# edition2024 caps so the tree builds on rustc < 1.85 (drop on modern toolchains)
hashbrown = "=0.14.5"
indexmap  = "=2.2.6"

[[bin]]
name = "bammetrics"
path = "src/main.rs"
