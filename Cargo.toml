[workspace]
resolver = "3"
members = ["crates/core", "crates/py"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
bammetrics-core = { path = "crates/core", version = "0.3.0" }
clap = { version = "4", features = ["derive"] }
noodles = { version = "0.119", features = ["bam", "sam", "bgzf", "core", "fasta"] }
pyo3 = { version = "0.30", features = ["extension-module"] }
thiserror = "2"

[profile.release]
lto = "fat"
codegen-units = 1
