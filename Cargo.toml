[workspace]
resolver = "3"
members = ["crates/core", "crates/verdict", "crates/report", "crates/cli", "crates/py"]

[workspace.package]
version = "0.13.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
bammetrics-core = { path = "crates/core", version = "0.13.0" }
bammetrics-verdict = { path = "crates/verdict", version = "0.13.0" }
bammetrics-report = { path = "crates/report", version = "0.13.0" }
clap = { version = "4", features = ["derive", "string"] }
noodles = { version = "0.119", features = ["bam", "sam", "bgzf", "core", "fasta", "vcf", "tabix"] }
pyo3 = { version = "0.30", features = ["extension-module"] }
regex = "1"
thiserror = "2"

[profile.release]
lto = "fat"
codegen-units = 1
