[workspace]
resolver = "3"
members = ["crates/core", "crates/verdict", "crates/report", "crates/formats", "crates/cli", "crates/py"]
exclude = ["vendor"]

[workspace.package]
version = "0.23.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
bammetrics-core = { path = "crates/core", version = "0.23.0" }
bammetrics-verdict = { path = "crates/verdict", version = "0.23.0" }
bammetrics-report = { path = "crates/report", version = "0.23.0" }
bammetrics-formats = { path = "crates/formats", version = "0.23.0" }
clap = { version = "4", features = ["derive", "string"] }
noodles = { version = "0.119", features = ["bam", "sam", "bgzf", "core", "cram", "csi", "fasta", "vcf", "tabix"] }
pyo3 = { version = "0.30", features = ["extension-module"] }
regex = "1"
thiserror = "2"
zlib-rs = "0.6"

[profile.release]
lto = "fat"
codegen-units = 1

# noodles-cram 0.102.0 with one change: the template length of attached mates
# follows htsjdk (vendor/README.md).
[patch.crates-io]
noodles-cram = { path = "vendor/noodles-cram" }
