name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  PICARD_VERSION: "3.5.0"

jobs:
  # The PDF report (cargo feature `pdf`, docs/pdf.md): clippy and every test
  # with all features, the PDF golden cases among them.
  pdf:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy, all features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests, all features
        run: cargo test --workspace --all-features

  # The workspace rust-version (Cargo.toml): the default build on rustc 1.91,
  # the floor noodles 0.119 and noodles-cram 0.102 declare.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.91

      - uses: Swatinem/rust-cache@v2

      - name: Build the default workspace on 1.91
        run: cargo build --workspace --locked

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit and integration tests
        run: cargo test --workspace

      # docs/05 section 4.8: page and index render time and size, binary
      # growth, added BAM passes. Fails at 2x any target (decision 11).
      - name: Size and speed budgets
        run: make budgets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v5

      - name: Install bwa and samtools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bwa samtools

      - name: Install bwa and samtools (macOS)
        if: runner.os == 'macOS'
        run: brew install bwa samtools

      # The release jar behind a `picard` command, the name the harness calls.
      # JAVA_OPTS reaches the JVM, as with the Homebrew wrapper.
      - name: Install Picard
        run: |
          mkdir -p "$HOME/picard/bin"
          curl -sSL --fail -o "$HOME/picard/picard.jar" \
            "https://github.com/broadinstitute/picard/releases/download/${PICARD_VERSION}/picard.jar"
          printf '#!/bin/sh\nexec java $JAVA_OPTS -jar "%s/picard/picard.jar" "$@"\n' "$HOME" > "$HOME/picard/bin/picard"
          chmod +x "$HOME/picard/bin/picard"
          echo "$HOME/picard/bin" >> "$GITHUB_PATH"

      # SortSam MAX_RECORDS_IN_RAM=1 on the foundation corpus has Picard open
      # one spill file per record (about 13,000). macOS runners allow 256 per
      # process and 12,288 in the system (kern.maxfiles), and a JVM on macOS
      # caps itself at 10,240 unless started with -XX:-MaxFDLimit.
      - name: Concordance harness
        run: |
          if [ "$RUNNER_OS" = macOS ]; then
            sudo sysctl -w kern.maxfiles=131072 kern.maxfilesperproc=65536
            export JAVA_OPTS="-XX:-MaxFDLimit"
          fi
          ulimit -n 65536 2>/dev/null || ulimit -n 16384
          echo "open files: $(ulimit -n)"
          make concordance

      - name: Python module
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python maturin pytest pysam
          make python-test
          make wheel

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: target/wheels/*.whl
