    "{bin}", "sort-sam", "tests/data/markdup.bam", "-o", "{out}/sorted.cram",
    "--sort-order", "coordinate", "-R", "tests/data/ref_100k.fa", "--create-md5-file",
]
needs = ["tests/data/markdup.bam", "tests/data/ref_100k.fa"]
max_rss_mib = 64
max_seconds = 30

# 3,000 reads of 50,000 bases (tests/data/make_long_reads.py writes the SAM text and its
# FASTA in the same shell, so its Python counts: 40 MiB), 225 MB as BAM records. A
# container ends at 8 MiB of BAM records as well as at 10,000 records, and at most 64 MiB
# wait for the encoders: 185 to 200 MiB at the default 8 threads, 777 MiB when a container held
# all 3,000 reads. The same reads to a BAM: 27 MiB.
[[command]]
name = "clean-sam cram long reads"
argv = [
    "sh", "-c",
    "python3 tests/data/make_long_reads.py {out} && {bin} clean-sam {out}/long.sam -o {out}/long.cram -R {out}/long.fa",
]
needs = ["tests/data/make_long_reads.py"]
max_rss_mib = 320
max_seconds = 60

