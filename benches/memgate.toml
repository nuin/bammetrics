]
needs = ["~/data/bammetrics-scale/waves/w03/chr20_21_22.bam"]
max_rss_mib = 512

[[command]]
name = "set-nm-md-and-uq-tags slice"
tier = "scale"
argv = [
    "{bin}", "set-nm-md-and-uq-tags", "~/data/bammetrics-scale/waves/w03/chr20_21_22.bam",
